services:
  lfs:
    build: .
    image: lfs-nix
    privileged: true          # the Nix sandbox needs namespaces
    volumes:
      - nix-store:/nix
      - .:/work
    working_dir: /work
    stdin_open: true
    tty: true

volumes:
  nix-store:
    name: lfs-nix-store       # a fixed name: each run uses the same store
